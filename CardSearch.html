<!DOCTYPE html>
<html>
<head>
    <title>Hearthstone Card Search</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/css/glide.core.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@glidejs/glide/dist/glide.min.js" defer></script>
    <script type="module" src="script.js" defer></script>

</head>
<body>
  <nav class="main-nav">
 
    <ul>
      <li><a href="CardSearch.html">Card Search</a></li>
      <li><a href="Details.html">Site Details</a></li>
      <li><a href="Favorites.html">Favorites</a></li>
    </ul>
  </nav>

  <h2>Featured Cards</h2>
  <div class="glide" id="card-carousel">
    <div class="glide__track" data-glide-el="track">
      <ul class="glide__slides" id="carousel-slides">
        <!-- Random card slides will be injected here via JS -->
      </ul>
    </div>
    <div data-glide-el="controls">
      <button data-glide-dir="<">Prev</button>
      <button data-glide-dir=">">Next</button>
    </div>
  </div>

  <h1>Hearthstone Card Search</h1>
  <label for="expansion">Choose an expansion:</label>
  
  <select id="expansion">
    <option value="" disabled selected>Expansion</option>
  </select>

  <button id="loadBtn">Load Cards</button>
  <ul id="cards"></ul>

  

</body>
</html>
